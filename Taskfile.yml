version: '3'

vars:
  ROOT: '{{.ROOT_DIR}}'
  SANDBOX: '{{.ROOT}}/sandbox'
  STAGE: '{{.ROOT}}/sandbox/stage'
  PREFIX: '{{.STAGE}}'
  ARTHA_CACHE: '$HOME/.artha-cache'
  XMAKE_VERSION: '3.1.2'
  XMAKE_DIR: '{{.ARTHA_CACHE}}/xmake-{{.XMAKE_VERSION}}'
  XMAKE_BIN: '{{.XMAKE_DIR}}/bin/xmake'

# Self-contained build tool (maven/uv/pnpm style): xmake is pinned to the
# versioned reference in deps.json (3.1.2) and kept under
# ~/.artha-cache/xmake-<version>/ (shared user cache, versioned). Nothing is
# installed to /usr/local or ~/.config/artha.conf. Populate the cache once
# with `task bootstrap-xmake`; every build task reuses it via xmake-ensure.
# The C compiler/linker and system libraries remain platform dependencies;
# pkg-config locates them via its built-in search path, so no distro-specific
# PKG_CONFIG_PATH is hardcoded here. The host toolchain (gcc/ld/ar/as) must
# take precedence over any shadowing toolchain - run builds with
# ensure `/usr/bin` is on `PATH` on hosts where that shadowing exists.

tasks:
  default:
    desc: Configure (release) + build Artha into ./sandbox
    deps:
      - xmake-ensure
    cmds:
      - '{{.XMAKE_BIN}} f --prefix="{{.PREFIX}}"'
      - '{{.XMAKE_BIN}}'

  build:
    desc: Configure (release) + build Artha into ./sandbox
    deps:
      - xmake-ensure
    cmds:
      - '{{.XMAKE_BIN}} f --prefix="{{.PREFIX}}"'
      - '{{.XMAKE_BIN}}'

  build-strict:
    desc: Configure + build with strict warnings (opt-in; does not break distro builds)
    deps:
      - xmake-ensure
    cmds:
      - '{{.XMAKE_BIN}} f --prefix="{{.PREFIX}}" --strict=yes'
      - '{{.XMAKE_BIN}}'

  test-asan:
    desc: Build with clang ASan+UBSan and run unit + integration tests into sandbox/asan
    deps:
      - xmake-ensure
    cmds:
      - '{{.XMAKE_BIN}} f -m debug -o sandbox/asan --cc=clang --cxflags="-fsanitize=address -fsanitize=undefined -fno-omit-frame-pointer -g" --ldflags="-fsanitize=address -fsanitize=undefined"'
      - '{{.XMAKE_BIN}} build artha-unit-test artha-integration-test'
      - 'ASAN_OPTIONS=abort_on_error=1:detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 LSAN_OPTIONS=suppressions={{.ROOT}}/tools/sanitizers/lsan.supp G_SLICE=always-malloc {{.XMAKE_BIN}} run artha-unit-test'
      - 'ASAN_OPTIONS=abort_on_error=1:detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 LSAN_OPTIONS=suppressions={{.ROOT}}/tools/sanitizers/lsan.supp G_SLICE=always-malloc {{.XMAKE_BIN}} run artha-integration-test'
      - '{{.XMAKE_BIN}} f -o sandbox --prefix="{{.PREFIX}}"'

  valgrind:
    desc: Run unit + integration tests and smoke under Valgrind (manual/scheduled; not CI-gated)
    deps:
      - xmake-ensure
    cmds:
      - '{{.XMAKE_BIN}} f --prefix="{{.PREFIX}}"'
      - '{{.XMAKE_BIN}} build artha-unit-test artha-integration-test'
      - 'SUPP_ARGS=""; for s in /usr/share/glib-2.0/valgrind/glib.supp /usr/share/gtk-4.0/valgrind/gtk.supp {{.ROOT}}/tools/valgrind/artha.supp; do [ -f "$s" ] && SUPP_ARGS="$SUPP_ARGS --suppressions=$s" || echo "valgrind: skipping missing suppression $s"; done; G_SLICE=always-malloc G_DEBUG=resident-modules valgrind --leak-check=full --error-exitcode=1 --num-callers=20 $SUPP_ARGS {{.XMAKE_BIN}} run artha-unit-test'
      - 'SUPP_ARGS=""; for s in /usr/share/glib-2.0/valgrind/glib.supp /usr/share/gtk-4.0/valgrind/gtk.supp {{.ROOT}}/tools/valgrind/artha.supp; do [ -f "$s" ] && SUPP_ARGS="$SUPP_ARGS --suppressions=$s" || echo "valgrind: skipping missing suppression $s"; done; G_SLICE=always-malloc G_DEBUG=resident-modules valgrind --leak-check=full --error-exitcode=1 --num-callers=20 $SUPP_ARGS {{.XMAKE_BIN}} run artha-integration-test'
      - '{{.XMAKE_BIN}} install -o "{{.STAGE}}"'
      - 'SUPP_ARGS=""; for s in /usr/share/glib-2.0/valgrind/glib.supp /usr/share/gtk-4.0/valgrind/gtk.supp {{.ROOT}}/tools/valgrind/artha.supp; do [ -f "$s" ] && SUPP_ARGS="$SUPP_ARGS --suppressions=$s" || echo "valgrind: skipping missing suppression $s"; done; G_SLICE=always-malloc G_DEBUG=resident-modules valgrind --leak-check=full --error-exitcode=1 --num-callers=20 $SUPP_ARGS {{.STAGE}}/bin/artha'

  install:
    desc: Build then stage install into ./sandbox/stage (no system changes)
    deps:
      - xmake-ensure
    cmds:
      - '{{.XMAKE_BIN}} f --prefix="{{.PREFIX}}"'
      - '{{.XMAKE_BIN}}'
      - '{{.XMAKE_BIN}} install -o "{{.STAGE}}"'

  run:
    desc: Run the staged Artha binary (requires a prior `task install`)
    cmds:
      - '{{.STAGE}}/bin/artha'

  debug:
    desc: Debug build with verbose wni diagnostics (DEBUG_LEVEL=3)
    deps:
      - xmake-ensure
    cmds:
      - '{{.XMAKE_BIN}} f --prefix="{{.PREFIX}}" --debug=verbose'
      - '{{.XMAKE_BIN}}'

  rebuild:
    desc: Clean then build (release)
    deps:
      - xmake-ensure
    cmds:
      - '{{.XMAKE_BIN}} -c'
      - '{{.XMAKE_BIN}} f --prefix="{{.PREFIX}}"'
      - '{{.XMAKE_BIN}}'

  clean:
    desc: Remove build artifacts under ./sandbox
    deps:
      - xmake-ensure
    cmds:
      - '{{.XMAKE_BIN}} -c'

  test:
    desc: Configure, build, then run unit + integration tests
    deps:
      - xmake-ensure
    cmds:
      - '{{.XMAKE_BIN}} f --prefix="{{.PREFIX}}"'
      - '{{.XMAKE_BIN}}'
      - '{{.XMAKE_BIN}} run artha-unit-test'
      - '{{.XMAKE_BIN}} run artha-integration-test'

  test-behavioral:
    desc: Run behavioural (app + UI) Gherkin scenarios (needs Xephyr :94; :0 is read-only)
    deps:
      - xmake-ensure
    cmds:
      - 'python3 tests/behavioral/run_tests.py tests/behavioral/features/artha.feature'

  bootstrap-xmake:
    desc: Build and cache pinned xmake {{.XMAKE_VERSION}} into {{.XMAKE_DIR}} (shared user cache, versioned)
    cmds:
      - '[ -x "{{.XMAKE_BIN}}" ] && echo "xmake {{.XMAKE_VERSION}} already cached at {{.XMAKE_DIR}}" || { echo "xmake {{.XMAKE_VERSION}} not cached. Build it once:"; echo "  git clone --recursive -b v{{.XMAKE_VERSION}} https://github.com/xmake-io/xmake.git xmake-src"; echo "  cd xmake-src && ./configure --prefix={{.XMAKE_DIR}} && make && make install && cp build/xmake {{.XMAKE_DIR}}/bin/xmake"; }'

  xmake-ensure:
    desc: Ensure pinned xmake {{.XMAKE_VERSION}} is available (cached or on PATH)
    cmds:
      - '[ -x "{{.XMAKE_BIN}}" ] && echo "using cached xmake {{.XMAKE_VERSION}}" || { command -v xmake >/dev/null 2>&1 && echo "using system xmake (run task bootstrap-xmake for a fully self-contained build)" || { echo "ERROR: xmake {{.XMAKE_VERSION}} not found in {{.XMAKE_DIR}} or on PATH" >&2; exit 1; }; }'

  format:
    desc: Apply clang-format to C/H sources
    cmds:
      - 'clang-format -i src/**/*.c src/**/*.h tests/**/*.c'

  format-check:
    desc: Check C/H sources conform to clang-format (exits non-zero on any diff)
    cmds:
      - 'clang-format --dry-run --Werror src/**/*.c src/**/*.h tests/**/*.c'
