# org.artha.Artha.yml - Artha as a local Flatpak
#
# LOCAL EXPLORATION MANIFEST. Not published anywhere; build and install
# into the user installation only:
#
#   flatpak run --command=flatpak-builder --user org.flatpak.Builder \
#       --state-dir=.flatpak-builder --repo=repo .flatpak-build org.artha.Artha.yml
#   flatpak install --user ./repo org.artha.Artha
#   flatpak run org.artha.Artha
#
# or simply (builds in .flatpak-build/, no local repo):
#
#   flatpak-builder --user .flatpak-build org.artha.Artha.yml && \
#   flatpak install --user .flatpak-build org.artha.Artha.yml
#
# Dependency policy (matches the xmake migration):
#   * No dependency is upgraded: WordNet 3.0, GTK+ 2.24.33, dbus-glib 0.112,
#     exactly the versions the system has.
#   * Everything is built from source inside the build sandbox; nothing
#     touches the host.
#   * org.freedesktop.Platform/Sdk 25.08 are already installed locally
#     (system installation). The app runs against the same runtime.
#
# Module choices:
#   xmake    - the new build system; built here for /app and removed in the
#              final cleanup (the app itself does not depend on xmake).
#   wordnet  - upstream Princeton WordNet 3.0; only lib + headers + dict
#              data are installed. The upstream configure requires Tcl/Tk
#              (for the wishwn GUI) which we deliberately do not build, so
#              the library and data are installed directly with make-free
#              commands (buildsystem: simple). DEFAULTPATH is pinned to
#              /app/dict, the upstream $prefix/dict default.
#   dbus-glib- POSIX session-bus helper for artha's single-instance logic.
#             Built with -std=gnu11: this pre-C23 codebase uses `bool` as an
#             identifier, which became a keyword in C23 (the SDK's gcc defaults
#             to gnu23). Same treatment for GTK+ 2 and WordNet.
#   gtk2     - GTK+ 2.24.33 (>= 2.24 as required); the SDK
#              ships glib/pango/cairo/atk/gdk-pixbuf 2 but not GTK 2.
#   artha    - the application, built with the xmake.lua from this tree.
#
# Enchant (libenchant-2) is intentionally NOT included: artha loads it at
# runtime via dlopen() and silently disables spelling suggestions when it
# is absent. The freedesktop SDK does not ship enchant-2.

app-id: org.artha.Artha
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: artha
separate-locales: false

finish-args:
  # artha is a pure X11 application (it binds hotkeys via libX11)
  - --share=ipc
  - --socket=x11
  - --device=dri
  # desktop notifications: artha dlopens libnotify at runtime
  - --talk-name=org.freedesktop.Notifications
  # single-instance support (org.artha.unique bus name + broadcast signal).
  # NB: do not add a separate --talk-name for the same name: flatpak's
  # finish-stage applies both flags to one policy key and the last wins.
  - --own-name=org.artha.unique

cleanup:
  - /bin/xmake

modules:
  - name: xmake
    buildsystem: simple
    sources:
      - type: file
        url: https://github.com/xmake-io/xmake/releases/download/v3.1.2/xmake-bundle-v3.1.2.linux.x86_64
        sha256: ac216aa71f4954cc1129aabf1099571d618211c1ef8db8fba871377ec5fb47cd
    build-commands:
      - install -Dm755 xmake-bundle-v3.1.2.linux.x86_64 /app/bin/xmake

  - name: wordnet
    buildsystem: simple
    sources:
      - type: archive
        url: https://wordnetcode.princeton.edu/3.0/WordNet-3.0.tar.bz2
        sha256: 6c492d0c7b4a40e7674d088191d3aa11f373bb1da60762e098b8ee2dda96ef22
    build-commands:
      # libwordnet: same sources Debian's wordnet-dev packages as libwordnet.a
      - cd lib && gcc -I../include -DDEFAULTPATH='"/app/dict"' -O2 -std=gnu11 -c binsrch.c morph.c search.c wnglobal.c wnhelp.c wnrtl.c wnutil.c
      - cd lib && ar rcs libwordnet.a *.o
      - install -Dm644 lib/libwordnet.a /app/lib/libwordnet.a
      - install -Dm644 include/wn.h /app/include/wn.h
      - install -d /app/dict
      - >
        install -m 644 dict/adj.exc dict/adv.exc dict/cntlist dict/cntlist.rev
        dict/data.adj dict/data.adv dict/data.noun dict/data.verb
        dict/frames.vrb dict/index.adj dict/index.adv dict/index.noun
        dict/index.sense dict/index.verb dict/lexnames dict/noun.exc
        dict/sentidx.vrb dict/sents.vrb dict/verb.Framestext dict/verb.exc
        dict/log.grind.3.0 /app/dict/

  - name: dbus-glib
    buildsystem: autotools
    build-options:
      cflags: -O2 -std=gnu11
    sources:
      - type: archive
        url: https://dbus.freedesktop.org/releases/dbus-glib/dbus-glib-0.112.tar.gz
        sha256: 7d550dccdfcd286e33895501829ed971eeb65c614e73aadb4a08aeef719b143a
    config-opts:
      - --prefix=/app

  - name: gtk2
    buildsystem: autotools
    build-options:
      # GTK+ 2 predates gcc 14, which turned -Wincompatible-pointer-types
      # into an error; keep the historic diagnostic level (flag-only fix).
      cflags: -O2 -std=gnu11 -Wno-incompatible-pointer-types -Wno-int-conversion -Wno-implicit-int
    sources:
      - type: archive
        url: https://download.gnome.org/sources/gtk+/2.24/gtk+-2.24.33.tar.xz
        sha256: ac2ac757f5942d318a311a54b0c80b5ef295f299c2a73c632f6bfb1ff49cc6da
    config-opts:
      - --prefix=/app
      - --disable-gtk-doc
      - --disable-gtktest

  - name: artha
    buildsystem: simple
    sources:
      - type: dir
        path: ../
    build-commands:
      - CPATH=/app/include LIBRARY_PATH=/app/lib xmake f --prefix=/app -m release
      - CPATH=/app/include LIBRARY_PATH=/app/lib xmake
      - CPATH=/app/include LIBRARY_PATH=/app/lib xmake install -o /app
      # Flatpak exports desktop files/icons named after the app-id
      - install -Dm644 /app/share/applications/artha.desktop /app/share/applications/org.artha.Artha.desktop
      - sed -i 's/^Icon=artha$/Icon=org.artha.Artha/' /app/share/applications/org.artha.Artha.desktop
      - install -Dm644 /app/share/pixmaps/artha.png /app/share/pixmaps/org.artha.Artha.png
