name: Sync README to Wiki

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-wiki:
    name: Sync README.md into wiki Home page
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout main repo (README.md source)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone the wiki repo
        run: |
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" /tmp/artha-wiki
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Copy README.md into wiki Home.md
        run: |
          cp README.md /tmp/artha-wiki/Home.md

      - name: Commit and push wiki Home.md
        run: |
          cd /tmp/artha-wiki
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet --exit-code Home.md; then
            echo "wiki Home.md already in sync with README.md; nothing to commit"
            exit 0
          fi
          git add Home.md
          git commit -m "docs: sync wiki Home from README.md ($(git -C "$GITHUB_WORKSPACE" log -1 --format=%h))"
          git push origin master
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
